<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1D6F42">
    <meta name="description" content="AI-powered Islamic knowledge assistant">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="DeenLink">
    
    <title>DeenLink AI</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    
    <!-- Font Awesome 6.5.0 only (remove duplicate) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/styles.css">
    
    <style>
        .search-spinner-css {
            width: 18px;
            height: 18px;
            border: 2px solid #e0e0e0;
            border-top-color: #1D6F42;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
            flex-shrink: 0;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Dark theme */
        body.dark-theme .search-spinner-css {
            border-color: #4a6572;
            border-top-color: #2ecc71;
        }
    </style>
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.5/dist/purify.min.js"></script>
</head>

<body>
    <div class="container layout">
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <button id="newChatBtn" class="sidebar-new-chat">
                    <i class="fas fa-plus"></i> New Chat
                </button>
            </div>
            <div id="conversationList" class="conversation-list"></div>
            <div class="sidebar-footer">
                <button id="settingsBtn" class="sidebar-settings-btn">
                    <i class="fas fa-cog"></i> Settings
                </button>
            </div>
        </aside>

        <div id="sidebarOverlay" class="sidebar-overlay"></div>

        <main class="main-chat">
            <header class="header-section">
                <div class="header-left">
                    <button class="menu-button" id="menuToggle" aria-label="Toggle menu">
                        <i class="fas fa-bars"></i>
                    </button>
                    
                    <button class="back-button" id="backBtn" aria-label="Go back">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    
                    <div class="header-title">
                        <i class="fas fa-robot"></i>
                        <span>DeenLink AI</span>
                    </div>
                </div>
                <div class="header-right">
                    <button class="header-action-btn" id="themeToggle" aria-label="Toggle theme">
                        <i class="fas fa-moon"></i>
                    </button>
                </div>
            </header>

            <div class="chat-container">
                <div class="messages-area">
                    <div class="quick-prompts">
                        <button class="quick-prompt-btn" data-prompt="What is the importance of Salah?">Salah Importance</button>
                        <button class="quick-prompt-btn" data-prompt="Give me a verse about patience">Patience Verse</button>
                        <button class="quick-prompt-btn" data-prompt="Explain the Five Pillars of Islam">Five Pillars</button>
                    </div>
                    <div class="chat-messages" id="chatMessages"></div>
                </div>

                <div class="input-area">
                    <div class="input-container">
                        <textarea class="message-input" id="messageInput" placeholder="Ask your Islamic question..." rows="1" aria-label="Message input"></textarea>
                        <button class="send-button" id="sendButton" aria-label="Send message">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
                
                <button id="scrollToBottomBtn" class="scroll-to-bottom-btn hidden" aria-label="Scroll to bottom">
                    <i class="fas fa-arrow-down"></i>
                </button>
            </div>
            
            <div id="error-toast" class="error-toast hidden" role="alert"></div>
            
            <!-- Feedback Modal -->
            <div id="feedbackModal" class="feedback-modal hidden">
                <div class="feedback-modal-overlay"></div>
                <div class="feedback-modal-content">
                    <div class="feedback-modal-header">
                        <h3>Report Issue</h3>
                        <button id="closeFeedbackModal" aria-label="Close modal"><i class="fas fa-times"></i></button>
                    </div>
                    <div class="feedback-modal-body">
                        <p>Please let us know why this response wasn't helpful. Your feedback helps us improve.</p>
                        <textarea id="feedbackReasonInput" placeholder="e.g., False fatwa, inaccurate source, unhelpful..." rows="3"></textarea>
                    </div>
                    <div class="feedback-modal-footer">
                        <button id="cancelFeedbackBtn" class="feedback-btn-cancel">Cancel</button>
                        <button id="submitFeedbackBtn" class="feedback-btn-submit">Submit</button>
                    </div>
                </div>
            </div>

            <!-- Settings Modal -->
            <div id="settingsModal" class="feedback-modal hidden">
                <div class="feedback-modal-overlay" id="settingsOverlay"></div>
                <div class="feedback-modal-content">
                    <div class="feedback-modal-header">
                        <h3>Settings</h3>
                        <button id="closeSettingsModal" aria-label="Close settings"><i class="fas fa-times"></i></button>
                    </div>
                    <div class="feedback-modal-body">
                        <div class="settings-group">
                            <label class="settings-label">Response Mode</label>
                            <p class="settings-desc">Choose how the AI should respond to your questions.</p>
                            <div class="mode-options">
                                <label class="mode-option">
                                    <input type="radio" name="responseMode" value="auto" checked>
                                    <div class="mode-card">
                                        <div class="mode-icon"><i class="fas fa-magic"></i></div>
                                        <div class="mode-info">
                                            <h4>Auto (Recommended)</h4>
                                            <span>Automatically decides between chat and knowledge base.</span>
                                        </div>
                                    </div>
                                </label>
                                <label class="mode-option">
                                    <input type="radio" name="responseMode" value="rag">
                                    <div class="mode-card">
                                        <div class="mode-icon"><i class="fas fa-book-quran"></i></div>
                                        <div class="mode-info">
                                            <h4>Knowledge Base</h4>
                                            <span>Strictly searches verified Islamic sources (Quran & Hadith).</span>
                                        </div>
                                    </div>
                                </label>
                                <label class="mode-option">
                                    <input type="radio" name="responseMode" value="chat">
                                    <div class="mode-card">
                                        <div class="mode-icon"><i class="fas fa-comments"></i></div>
                                        <div class="mode-info">
                                            <h4>Chat Only</h4>
                                            <span>Conversational mode without searching sources.</span>
                                        </div>
                                    </div>
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="feedback-modal-footer">
                        <button id="saveSettingsBtn" class="feedback-btn-submit w-full text-center justify-center">Save Settings</button>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
