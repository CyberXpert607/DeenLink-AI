<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeenLink AI</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<div class="container layout">

    <!-- Sidebar -->
    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <button id="newChatBtn" class="sidebar-new-chat">
                <i class="fas fa-plus"></i> New Chat
            </button>
        </div>

        <div id="conversationList" class="conversation-list"></div>
    </div>

    <div id="sidebarOverlay"></div>

    <!-- Main Content -->
    <div class="main-chat">

        <!-- Header -->
        <header class="header-section">
            <div class="header-left">
                <button class="menu-button" id="menuToggle">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="header-title">
                    <i class="fas fa-robot"></i> DeenLink AI
                </div>
            </div>

            <div class="header-right">
                <button class="header-action-btn" id="themeToggle">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </header>

        <!-- Chat Container -->
        <div class="chat-container">
            <div class="messages-area">

                <div class="quick-prompts">
                    <button class="quick-prompt-btn" data-prompt="What is the importance of Salah?">Salah Importance</button>
                    <button class="quick-prompt-btn" data-prompt="Give me a verse about patience">Patience Verse</button>
                    <button class="quick-prompt-btn" data-prompt="Explain the Five Pillars of Islam">Five Pillars</button>
                </div>

                <div class="chat-messages" id="chatMessages"></div>
            </div>

            <div class="input-area">
                <div class="input-container">
                    <textarea class="message-input" id="messageInput" placeholder="Ask your Islamic question..." rows="1"></textarea>
                    <button class="send-button" id="sendButton">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
        <div id="error-toast" class="error-toast hidden"></div>

    </div>
</div>

<script src="/js/script.js"></script>
</body>
</html>
