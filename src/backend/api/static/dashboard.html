<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeenLink AI - Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        h1 { color: #1D6F42; margin: 0; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-left: 5px solid #1D6F42; }
        .card h3 { margin: 0 0 10px 0; color: #666; font-size: 14px; text-transform: uppercase; }
        .card .value { font-size: 32px; font-weight: bold; color: #1D6F42; }
        .error { background: #ffebee; color: #c62828; padding: 15px; border-radius: 5px; margin-bottom: 20px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-chart-line"></i> Admin Dashboard</h1>
            <button onclick="fetchMetrics()" style="background: #1D6F42; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;"><i class="fas fa-sync"></i> Refresh</button>
        </div>
        
        <div id="errorMsg" class="error"></div>
        
        <div class="grid">
            <div class="card">
                <h3>Total Conversations</h3>
                <div class="value" id="valConversations">-</div>
            </div>
            <div class="card">
                <h3>Total Messages</h3>
                <div class="value" id="valMessages">-</div>
            </div>
            <div class="card">
                <h3>Tokens Generated</h3>
                <div class="value" id="valTokens">-</div>
            </div>
            <div class="card">
                <h3>Total Feedback</h3>
                <div class="value" id="valFeedbacks">-</div>
            </div>
        </div>
    </div>

    <script>
        // Note: For simplicity, we are getting a token as if we are a normal user,
        // but in production, this should check for admin specific token/session.
        const API_BASE_URL = '/api/v2';
        let jwtToken = null;
        let jwtExpiry = null;

        async function getValidToken() {
            const now = Date.now();

            if (jwtToken && jwtExpiry && now < jwtExpiry) {
                return jwtToken;
            }

            const res = await fetch("https://deenlink.org/api/auth/token_server.php", {
                method: "POST",
                credentials: "include"
            });

            if (!res.ok) {
                const text = await res.text();
                console.error("Token server error", text);
                throw new Error("Token fetch failed");
            }

            const contentType = res.headers.get("content-type");

            if (!contentType || !contentType.includes("application/json")) {
                const text = await res.text();
                console.error("Expected JSON but got:", text);
                throw new Error("Invalid token response format");
            }

            const data = await res.json();
            jwtToken = data.token;
            jwtExpiry = now + (5 * 60 * 1000);

            return jwtToken;
        }

        async function fetchMetrics() {
            try {
                document.getElementById('errorMsg').style.display = 'none';
                const token = await getValidToken();
                const response = await fetch(`${API_BASE_URL}/admin/dashboard`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!response.ok) {
                    throw new Error('Failed to fetch metrics (ensure you have admin privileges)');
                }
                
                const data = await response.json();
                const metrics = data.metrics;
                
                // Animate counting up (simple version)
                document.getElementById('valConversations').textContent = metrics.conversations;
                document.getElementById('valMessages').textContent = metrics.messages;
                document.getElementById('valTokens').textContent = metrics.tokens_generated;
                document.getElementById('valFeedbacks').textContent = metrics.feedbacks;
                
            } catch (err) {
                document.getElementById('errorMsg').textContent = err.message;
                document.getElementById('errorMsg').style.display = 'block';
            }
        }

        // Fetch on load
        fetchMetrics();
    </script>
</body>
</html>
